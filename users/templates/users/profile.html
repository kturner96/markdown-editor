{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex flex-row justify-between p-2">
    <h1 class="text-2xl font-bold p-2">Your documents</h1>
    <button type="button" class="bg-white rounded px-2 text-slate-600 text-sm hover:bg-gray-200 hover:cursor-pointer">New document</button>
    </div>
    <table class="w-full table-fixed border-separate border-spacing-0 rounded-lg overflow-hidden border border-slate-600">
        <colgroup>
            <col style="width: 60%;">
            <col style="width: 30%;">
            <col style="width: 20%;">
        </colgroup>
        <tr class="uppercase bg-slate-600">
            <th class="text-left py-2 px-3">Title</th>
            <th class="text-left py-2 px-3">Last edited</th>
            <th class="text-left py-2 px-3">Words</th>
        </tr>
        {% for document in documents %}
            <tr class="hover:bg-slate-700 cursor-pointer relative">
                <td class="py-2 px-3">
                    <a href="{% url 'editor' document.pk %}" class="absolute inset-0"></a>
                    {{ document.title }}
                </td>
                <td class="py-2 px-3 whitespace-nowrap">{{ document.updated_at|timesince }} ago</td>
                <td class="py-2 px-3">1050</td>
            </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
