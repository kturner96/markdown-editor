{% extends "base.html" %}
{% block content %}
<script src="https://unpkg.com/alpinejs" defer></script>

<div class="max-w-2xl mx-auto py-6 px-4 font-mono" x-data="{ showLogin: true }">

    <div x-show="showLogin">
        <h2 class="uppercase text-sm text-slate-400">Welcome back</h2>
        <h1 class="text-2xl font-bold">Sign in to Drafter</h1>
        <form method="post" class="flex flex-col gap-4">
            {% csrf_token %}
            {{ login_form.as_p }}
            <div>
                <button type="submit" name="login_form" class="bg-slate-400 text-white py-4 w-full border border-slate-600">
                    Sign in
                </button>
            </div>
        </form>
        <p class="text-sm text-slate-400 mt-4">
            New here?
            <button type="button" @click="showLogin = false" class="underline">Create an account</button>
        </p>
    </div>

    <div x-show="!showLogin">
        <h2 class="uppercase text-sm text-slate-400">Get started</h2>
        <h1 class="text-2xl font-bold">Create your account</h1>
        <form method="post" class="flex flex-col gap-4">
            {% csrf_token %}
            {{ register_form.as_p }}
            <div>
                <button type="submit" name="register_form" class="bg-slate-400 text-white py-4 w-full border border-slate-600">
                    Register
                </button>
            </div>
        </form>
        <p class="text-sm text-slate-400 mt-4">
            Already have an account?
            <button type="button" @click="showLogin = true" class="underline">Sign in</button>
        </p>
    </div>

</div>
{% endblock %}
